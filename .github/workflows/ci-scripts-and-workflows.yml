name: CI - Scripts and workflows

on:
  pull_request:
    paths:
      - "**/*.sh"
      - "**/*.ps1"
      - "**/*.psm1"
      - "scripts/modernization/**"
      - ".github/workflows/*.yml"
      - ".github/workflows/*.yaml"
  push:
    branches: [main]
    paths:
      - "**/*.sh"
      - "**/*.ps1"
      - "**/*.psm1"
      - "scripts/modernization/**"
      - ".github/workflows/*.yml"
      - ".github/workflows/*.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse Bash scripts
        shell: bash
        run: |
          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(find . -type f -name '*.sh' -not -path './.git/*' -print0)
      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $errors = @()
          $powerShellFiles = @(
            Get-ChildItem -Path . -Recurse -File -Filter *.ps1
            # Vendored packages may contain modules for legacy PowerShell versions.
            Get-ChildItem -Path scripts -Recurse -File -Filter *.psm1
          )
          $powerShellFiles | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref] $tokens,
              [ref] $parseErrors
            ) | Out-Null
            $errors += $parseErrors
          }

          if ($errors.Count -gt 0) {
            $errors | ForEach-Object {
              Write-Error "$($_.Extent.File):$($_.Extent.StartLineNumber): $($_.Message)"
            }
            exit 1
          }
      - name: Install actionlint
        shell: bash
        run: |
          GOBIN="${RUNNER_TEMP}/bin" go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"
      - name: Validate GitHub Actions workflows
        run: actionlint -color

  modernization-tests:
    name: Modernization boundaries (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Exercise synthetic inputs without models or GitHub writes
        shell: pwsh
        run: .\scripts\modernization\tests\Test-Modernization.ps1
