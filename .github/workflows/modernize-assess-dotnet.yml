name: Modernize assessment - .NET

on:
  schedule:
    - cron: "43 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: modernize-assess-dotnet
  cancel-in-progress: false

env:
  MODERNIZE_ENABLED: ${{ vars.MODERNIZE_ENABLED }}

jobs:
  assess:
    if: vars.MODERNIZE_ENABLED == 'true' || (vars.MODERNIZE_ENABLED == 'pilot' && github.event_name == 'workflow_dispatch')
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: microsoft/setup-msbuild@v2
        with:
          vs-version: "[17.0,18.0)"
          msbuild-architecture: x64
      - uses: NuGet/setup-nuget@v2
        with:
          nuget-version: "6.14.0"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Install the explicitly pinned Modernize distribution
        shell: pwsh
        env:
          RELEASE_URL: ${{ vars.MODERNIZE_WINDOWS_URL }}
          RELEASE_SHA256: ${{ vars.MODERNIZE_WINDOWS_SHA256 }}
        run: |
          .\scripts\modernization\Install-Modernize.ps1 `
            -Url $env:RELEASE_URL -Sha256 $env:RELEASE_SHA256 `
            -Destination (Join-Path $env:RUNNER_TEMP 'modernize-cli')
      - name: Assess BookCatalog without changing source
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.MODERNIZE_COPILOT_TOKEN }}
        run: |
          .\scripts\modernization\Invoke-Modernization.ps1 -Mode Assess -Track dotnet `
            -CandidateRoot (Join-Path $env:RUNNER_TEMP 'assessment-source') `
            -OutputDirectory (Join-Path $env:RUNNER_TEMP 'assessment')
      - name: Upload only curated assessment evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: assessment-dotnet-${{ github.run_attempt }}
          path: ${{ runner.temp }}/assessment/evidence/
          if-no-files-found: error
          retention-days: 14
